
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # HTML entry point: always revalidate
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Vite-generated assets: long-lived browser caching
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Other static files
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
    }

    # React client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
